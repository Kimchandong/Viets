# ============================================================================
# Supabase CLI 설정
#
# [2026-10-22] 이 파일을 만든 이유는 하나다 — research-news 함수를 배포할 때마다
# --no-verify-jwt를 손으로 붙여야 하는 상태를 없애기 위해서다.
#
# 그 플래그를 한 번이라도 빼먹으면 게이트웨이가 다시 JWT를 요구하고, 스케줄러의
# 호출이 401로 막힌다. 그런데 **아무 오류도 눈에 띄지 않는다** — cron은 계속
# 성공으로 기록되고(요청은 보냈으니까), 수집만 조용히 멈춘다. 사람이 기억해야
# 하는 구조는 언젠가 깨지고, 깨진 걸 알아채기까지 며칠이 걸린다.
#
# ── 의도적으로 최소만 적는다 ────────────────────────────────────────────────
# 이 파일은 CLI 전역 설정이라 [db] [auth] [storage] 같은 블록도 받는다. 그런 값은
# 주로 `supabase start`(로컬 Docker 스택)를 위한 것이고 이 프로젝트는 쓰지 않는다.
# 적지 않은 항목은 CLI 기본값이 쓰이므로, 지금 동작을 바꾸지 않으려면 **적지 않는
# 것이 맞다.** 나중에 필요해지면 그때 블록을 더한다.
# ============================================================================

project_id = "nbfmodrxnduaxcpxgqpj"

# ── 엣지 함수 ───────────────────────────────────────────────────────────────

# 수집 엔진. 게이트웨이의 JWT 검사를 끈다.
#
# 보안이 약해지는 것이 아니다. 그 검사는 anon key(앱 번들에 들어가는 공개 값)로
# 통과되므로 누가 불렀는지를 가리지 못한다. 실제 권한 판정은 함수 안에서 한다:
#   · x-cron-secret 일치        → 스케줄러
#   · is_admin_or_above         → 관리자
# 자격 증명이 하나도 없는 요청은 DB를 건드리기 전에 403으로 끝낸다.
[functions.research-news]
verify_jwt = false

# 나머지 함수는 기본값(verify_jwt = true)을 그대로 쓴다. 여기 적지 않는 이유는
# 적어 두면 "이 파일이 모든 함수의 설정을 쥐고 있다"는 인상을 주기 때문이다 —
# 실제로는 이 한 함수만 예외다.
